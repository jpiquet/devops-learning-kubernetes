name: docker

services:
  app:
    image: jpiquet/docker-app:v1.0
    container_name: node
    build: .
    ports:
      - 3000:3000
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PWD}@db:5432/${DB_NAME}
    networks:
     - frontend
     - backend

  front:
    image: nginx:1.30-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    container_name: nginx
    ports:
      - 8080:80
    volumes:
      - ./front/:/usr/share/nginx/html
    networks:
     - frontend

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PWD}
    volumes:
     - db_volume:/var/lib/postgresql/data
    networks:
     - backend

volumes:
  db_volume:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge